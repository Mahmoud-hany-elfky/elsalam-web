<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsalam web - المنصة المدرسية الذكية</title>
    <link rel="stylesheet" href="style 1.css">
</head>
<body>

    <div class="app-layout">
        <!-- القائمة الجانبية مثبتة على اليسار (الشمال) -->
        <aside class="sidebar-left">
            <div class="brand">
                <h2>Elsalam web</h2>
                <p>المنصة الذكية</p>
            </div>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-link active">لوحة التحكم</a>
                <a href="#lost-found" class="nav-link">المفقودات</a>
                <a href="#adds" class="nav-link">الإعلانات</a>
                <a href="#planner" class="nav-link">جدول المهام</a>
                <a href="#projects" class="nav-link">معرض المشاريع</a>
                <a href="#Email" class="nav-link">Email</a>
                
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <header class="banner">
                <img src="https://png.pngtree.com/thumb_back/fh260/background/20240914/pngtree-diverse-group-of-students-studying-in-a-library-with-open-books-image_16203293.jpg" alt="طلاب المدرسة" class="banner-img">
                <div class="banner-text">
                    <h1>أهلاً بك في منصة Elsalam web</h1>
                    <p>مساحتك المتكاملة للتنظيم والإعلانات والمفقودات والمشاريع المدرسية.</p>
                    
                </div>
            </header>

            <section id="dashboard" class="section">
                <h2>لوحة التحكم</h2>
                <div class="cards-grid">
                    <div class="card">
                        <h3>المفقودات</h3>
                        <p class="stat-number">12</p>
                    </div>
                    <div class="card">
                        <h3>الواجبات القادمة</h3>
                        <p class="stat-number">4</p>
                    </div>
                    <div class="card">
                        <h3>إعلانات اليوم</h3>
                        <p class="stat-number">2</p>
                    </div>
                </div>
                

            </section>
            <h6>by mahmoud hany</h6>

            
             
        </main>
    </div>

</body>
</html>
